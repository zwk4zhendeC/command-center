service:
  flush: 1
  daemon: off
  #  log_level: info
  http_server: on
  http_listen: 0.0.0.0
  http_port: 2020

# 官方提供的解析器：https://github.com/fluent/fluent-bit/blob/master/conf/parsers.conf
parsers:
  - name: json
    format: json
  - name: docker
    format: json
    time-key: time
    time-format: '%Y-%m-%dT%H:%M:%S.%L'
    time-keep: on

pipeline:
  inputs:
    - name: systemd
      tag: systemd.app.wp-editor
      systemd_filter:
        - _SYSTEMD_UNIT=mihomo.service
        - _SYSTEMD_UNIT=systemd-networkd.service
        - _SYSTEMD_UNIT=ssh.service
        - _SYSTEMD_UNIT=systemd-logind.service
      read_from_tail: on
    # 密码服务日志
    - name: tail
      path: /host/var/lib/docker/containers/*/*.log
      path_key: filename
      refresh_interval: 5
      skip_long_lines: on
      tag: docker.app.*
      parser: docker
#    - name: cpu
#      tag: my_cpu

  filters:
    # 添加容器名信息
    - name: lua
      match: 'docker.app.*'
      script: ./script/docker-utils.lua
      call: extract_container_name

    # 只保留容器名=vaultwarden和caddy的
    - name: grep
      match: 'docker.app.*'
      logical_op: or
      regex:
        - container_name node-exporter

    - name: parser
      match: docker.*
      key_name: log
      parser: json
      preserve_key: false
      reserve_data: true

    # 将容器名提供到tag中
    - name: rewrite_tag
      match: 'docker.app.*'
      rule: $container_name .* retag.docker.app.$container_name false

    # 添加相关业务字段
    - name: modify
      match: '*'
      add:
        - host_name ${HOSTNAME}
        - host_ip ${HOST_IP}

  outputs:
    - name: stdout
      match: "*"
    - name: http
      match: "*"
      host: ${CENTRE_HOST_IP}
      port: 30429
      uri: /insert/jsonline
      format: json_lines
      json_date_key: "@timestamp"
      json_date_format: iso8601
      header: "Content-Type application/json"
      tls: off