version: '3.8'

services:
  fluent-bit:
    image: fluent/fluent-bit:5.1.1   # 选择你需要的版本
    working_dir: /fluent-bit/etc
    restart: always
    labels:
      app.name: "fluent-bit"
      zwk-label: "19032"
    env_file:
      - .env
    environment:
      - FLB_LOG_LEVEL=info
    ports:
      - "2021:2021"
    volumes:
      # 挂载配置文件
      - ./fluent-bit:/fluent-bit/etc
      # 宿主机日志目录
      - /var/log:/var/log:ro
      # Docker 容器日志目录
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      # systemd所需的目录
      - /etc/machine-id:/etc/machine-id:ro
      # -  /run/log/journal:/run/log/journal
      # 系统时区（可选）
      - /etc/localtime:/etc/localtime:ro
      # 系统时区（可选）
      - /:/host:ro
    command: >
      /fluent-bit/bin/fluent-bit
      -c /fluent-bit/etc/fluent-bit.yml

  cadvisor:
    image: ghcr.io/google/cadvisor:0.55.1
    container_name: cadvisor
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /var/run:/var/run:ro
      - /:/rootfs:ro
      - /sys:/sys:ro
      - /dev/disk/:/dev/disk:ro
      # docker 通信入口
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports:
      - "8080:8080"
    restart: unless-stopped
  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.10.2
    container_name: node-exporter
    command:
      - '--path.rootfs=/host'
    ports:
      - "9100:9100"
    pid: host
    restart: unless-stopped
    volumes:
      - '/:/host:ro,rslave'

  victoria-logs:
    container_name: victoria-logs
    image: victoriametrics/victoria-logs:v1.43.0
    ports:
      - "30429:9428"
    # 数据存储目录,按需开启
    volumes:
      - logs_data:/storage
    command:
      - --envflag.enable
      - --envflag.prefix=VLOGS_
      - --http.shutdownDelay=15s
      - --httpListenAddr=:9428
      - --loggerFormat=json
      - --retentionPeriod=15d
      - --storageDataPath=/storage
    environment:
      - TZ=Asia/Shanghai
    # 添加健康检查
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:9428/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  logs_data: